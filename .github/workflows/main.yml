---
"on":
  push:
    paths-ignore:
      - "**.md"
      - doc/*
  pull_request:
    paths-ignore:
      - "**.md"
      - doc/*
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: moonrepo/setup-rust@v1
        with:
          toolchain: stable
          override: true
      - name: Run tests
        run: |
          cargo test --features=lua51 --manifest-path=packages/auth/Cargo.toml
          cargo test --features=lua51 --manifest-path=packages/zfh/Cargo.toml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate template.lua
        run: |
          perl -00ne 'print if $. == 2' ./*-scm-1.rockspec > template.lua
      - uses: lumen-oss/luarocks-tag-release@v9
        env:
          LUX_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        with:
          lux-version: latest
          template: template.lua
      - name: Pack
        run: |
          lx pack zhihu.nvim
      - uses: actions/upload-artifact@v4
        if: "! startsWith(github.ref, 'refs/tags/')"
        with:
          path: |
            *.rock
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.rock
      - name: Upload
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          scripts/upload.sh ./*.rock
        env:
          LUAROCKS_API_KEY: ${{secrets.LUAROCKS_API_KEY}}
